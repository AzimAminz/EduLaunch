[project]
name = "content-service"
version = "0.1.0"
description = "EduLaunch content pipeline: official sources, change detection, AI drafts and cited answers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic-settings>=2.16.1",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
