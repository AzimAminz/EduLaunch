[project]
name = "content-service"
version = "0.1.0"
description = "EduLaunch content pipeline: official sources, change detection, AI drafts and cited answers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic-settings>=2.16.1",
  "httpx>=0.28.1",
  "selectolax>=0.3.21",
  "rapidocr>=3.10.0",
  "onnxruntime>=1.32.0",
  "pypdf>=7.1.1",
  "pypdfium2>=5.15.2",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs the local Supabase database (pnpm db:start)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
